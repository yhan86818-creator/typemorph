name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Type Check & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: './package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run Type Check and Vitest
      run: npm run test

    - name: Run UX regression tests
      run: npm run test:ux

    - name: Run production build
      run: npm run build

  bench:
    name: Bench Automation
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'schedule'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: './package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run Bench Suite
      run: |
        npm run bench
        npx vitest run src/lib/__bench__/analysis.bench.test.ts --run

    - name: Upload bench artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bench-results
        path: |
          bench-results-real.json
          bench-analysis.json
          bench-results.json
